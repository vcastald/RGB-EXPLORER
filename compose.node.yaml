name: rgb-explorer-node
services:
  node:
    image: kaleidoswap/rgb-lightning-node@sha256:4676ed77dd97c7ec3043e660cf8aa834463b4b0df5eb49045c0575b91c3f4737
    network_mode: bridge
    command: ["/data", "--daemon-listening-port", "${RGB_NODE_PORT:-3901}", "--ldk-peer-listening-port", "${RGB_PEER_PORT:-10091}", "--disable-authentication", "--network", "signetcustom"]
    ports:
      - "${RGB_NODE_HOST:-127.0.0.1}:${RGB_NODE_PORT:-3901}:${RGB_NODE_PORT:-3901}"
      - "${RGB_NODE_HOST:-127.0.0.1}:${RGB_PEER_PORT:-10091}:${RGB_PEER_PORT:-10091}"
    volumes:
      - ./.local-node/data:/data
    restart: "no"
